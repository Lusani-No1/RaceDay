name: Validate Part 1 Repo Structure

# Runs whenever changes are pushed or a PR is opened against master or main,
# so you get a pass/fail check on every commit.
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::Missing required 'docs' folder at repo root."
            exit 1
          fi
          echo "docs folder found."

      - name: Check ERD file exists
        run: |
          if ! ls docs/*ERD*.png >/dev/null 2>&1 && ! ls docs/*ERD*.pdf >/dev/null 2>&1; then
            echo "::error::No ERD file (PNG or PDF containing 'ERD' in the name) found in /docs."
            exit 1
          fi
          echo "ERD file found."

      - name: Check API endpoint plan exists
        run: |
          if ! ls docs/*ndpoint*.md >/dev/null 2>&1 && ! ls docs/*ndpoint*.pdf >/dev/null 2>&1; then
            echo "::error::No endpoint plan file (Markdown or PDF containing 'Endpoint' in the name) found in /docs."
            exit 1
          fi
          echo "Endpoint plan file found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql >/dev/null 2>&1; then
            echo "::error::No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README.md exists at repo root
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::Missing README.md at repo root."
            exit 1
          fi
          echo "README.md found."

      - name: Structure validation passed
        run: echo "All required Part 1 files are present. ✅"
